<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlanWay</title>
<meta name="description" content="คำนวณเวลาออกจากบ้านและเวลาเตรียมตัว จากเวลานัดและเส้นทางขนส่งสาธารณะกรุงเทพฯ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- อุ่นการเชื่อมต่อไว้ตั้งแต่ตอนอ่าน <head> — จับเวลาแล้ว DNS+TCP+TLS กินไป 0.63 วินาที
     จาก 0.85 วินาทีของการดึงพยากรณ์ทั้งก้อน (ตัวข้อมูลเองแค่ 8.5 KB)
     ทำตรงนี้ทำให้ handshake เกิดคู่ขนานกับการโหลดสคริปต์ แทนที่จะเริ่มหลังสคริปต์รันแล้ว -->
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://api.bigdatacloud.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/styles.css">
<!-- ธีม/ภาษา ต้องถูกทาก่อน paint แรก จึงโหลดแบบ blocking ตรงนี้ -->
<script src="js/prefs.js"></script>
</head>
<body>
<div class="wrap">
  <header class="nav">
    <div class="brand">
      <h1 data-i18n="app.name"></h1>
      <span class="kicker" data-i18n="app.eyebrow"></span>
    </div>

    <button class="navtoggle" id="navToggle" aria-expanded="false" aria-controls="topRight" data-i18n-al="menu.more">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
        <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="top-right" id="topRight">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-one" aria-selected="true" data-i18n="tab.one"></button>
        <button role="tab" id="tab-day" aria-selected="false" data-i18n="tab.day"></button>
        <button role="tab" id="tab-hist" aria-selected="false" data-i18n="tab.hist"></button>
      </div>

      <div class="tools">
        <div class="popwrap">
          <button class="icobtn" id="langBtn" aria-haspopup="menu" aria-expanded="false" data-i18n-al="menu.lang">
            <span id="langCur">ไทย</span><span class="caret">▾</span>
          </button>
          <div class="pop hide" id="langPop" role="menu">
            <button class="popitem" data-lang="th" role="menuitemradio">ไทย</button>
            <button class="popitem" data-lang="en" role="menuitemradio">English</button>
          </div>
        </div>

        <div class="popwrap">
          <button class="icobtn" id="themeBtn" aria-haspopup="menu" aria-expanded="false" data-i18n-al="menu.theme">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/>
            </svg><span class="caret">▾</span>
          </button>
          <div class="pop wide hide" id="themePop" role="menu">
            <div class="popttl" data-i18n="theme.mode"></div>
            <div class="segs" id="themeModes">
              <button data-mode="auto" data-i18n="theme.auto"></button>
              <button data-mode="light" data-i18n="theme.light"></button>
              <button data-mode="dark" data-i18n="theme.dark"></button>
            </div>
            <div class="popttl" data-i18n="theme.color"></div>
            <div class="swatches" id="swatches"></div>
          </div>
        </div>

        <button class="ghost" id="copyBtn" data-i18n="btn.copy"></button>

        <div class="popwrap">
          <button class="ghost solid" id="authBtn" aria-haspopup="dialog" aria-expanded="false"></button>
          <div class="pop hide" id="acctPop" role="menu">
            <div class="acctcard">
              <span class="av" id="acctAv">—</span>
              <span class="acctmeta">
                <b id="acctName">—</b>
                <small id="acctMail">—</small>
                <small class="prov" id="acctProv">—</small>
              </span>
            </div>
            <button class="popitem danger" id="signOutBtn" data-i18n="btn.signout"></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <!-- ============ ค้นหาเส้นทาง ============ -->
    <section class="hero">
      <div class="herotxt">
        <h2 data-i18n="hero.title"></h2>
        <p data-i18n="hero.sub"></p>
      </div>

      <div class="sbox">
        <div class="splaces">
          <label class="sfield acwrap" id="wrapOrigin">
            <svg class="sicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <circle cx="8" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <span data-i18n="f.origin"></span>
            <input type="text" id="origin" autocomplete="off" data-i18n-ph="ph.place">
          </label>

          <button class="swapbtn" id="swap" data-i18n-al="btn.swap">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path d="M4.5 2.5v9M4.5 2.5 2 5M4.5 2.5 7 5M11.5 13.5v-9M11.5 13.5 9 11M11.5 13.5 14 11"
                    fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <label class="sfield acwrap" id="wrapDest">
            <svg class="sicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M8 14.5S2.8 9.9 2.8 6.6a5.2 5.2 0 0 1 10.4 0c0 3.3-5.2 7.9-5.2 7.9z"
                    fill="none" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="8" cy="6.5" r="1.8" fill="currentColor"/>
            </svg>
            <span data-i18n="f.dest"></span>
            <input type="text" id="dest" autocomplete="off" data-i18n-ph="ph.place">
          </label>
        </div>

        <div class="stimes">
          <label class="sfield">
            <svg class="sicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <rect x="2.2" y="3.2" width="11.6" height="10.6" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M2.2 6.4h11.6M5.5 1.8v2.6M10.5 1.8v2.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span data-i18n="f.date"></span>
            <input type="date" id="tripDate">
          </label>

          <label class="sfield">
            <svg class="sicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 4.4V8l2.6 1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span id="timeLabel" data-i18n="f.arriveBy"></span>
            <input type="time" id="arrive" value="09:00">
          </label>

          <div class="sfield">
            <span data-i18n="f.timeMode"></span>
            <div class="segs whenseg" role="group" data-i18n-al="f.timeMode">
              <button data-when="arrive" aria-pressed="true" data-i18n="when.arrive"></button>
              <button data-when="depart" aria-pressed="false" data-i18n="when.depart"></button>
            </div>
          </div>

          <label class="sfield">
            <span data-i18n="f.cushion"></span>
            <select id="cushion">
              <option value="0" data-i18n="cushion.0"></option>
              <option value="5" data-i18n="cushion.5"></option>
              <option value="10" selected data-i18n="cushion.10"></option>
              <option value="15" data-i18n="cushion.15"></option>
              <option value="30" data-i18n="cushion.30"></option>
            </select>
          </label>

          <button class="primary" id="planBtn" data-i18n="btn.plan"></button>
        </div>
      </div>
    </section>

    <div id="oneView">
      <div id="errBox" class="err hide"></div>

      <!-- ============ คำตอบหลัก ============
           คำถามที่เว็บนี้มีไว้ตอบคือ "ต้องออกจากบ้านกี่โมง" จึงเป็นบรรทัดเดียวที่ตัวใหญ่ที่สุด -->
      <section class="answer" aria-live="polite">
        <div class="ansmain">
          <span class="k" data-i18n="v.leave"></span>
          <span class="t mono" id="tLeave">—</span>
          <span class="s" id="sLeave">—</span>
        </div>
        <div class="anssides">
          <div class="ansside">
            <span class="k" data-i18n="v.prep"></span>
            <span class="t mono" id="tPrep">—</span>
            <span class="s" id="sPrep">—</span>
          </div>
          <div class="ansside">
            <span class="k" data-i18n="v.arrive"></span>
            <span class="t mono" id="tArrive">—</span>
            <span class="s" id="sArrive">—</span>
          </div>
        </div>
      </section>

      <!-- แถบสรุปเบา ๆ: ใช้เวลา ค่าโดยสาร เปลี่ยนรถ เดิน -->
      <div class="sumbar" id="sumBar"></div>
      <div class="vbar" id="vbar"></div>

      <!-- ============ ตัวเลือกเส้นทาง ============ -->
      <section class="routes">
        <h2 class="secttl" data-i18n="routes.title"></h2>
        <div class="modes" id="modes"></div>
      </section>

      <!-- ============ ไทม์ไลน์ 40% | แผนที่ 60% ============ -->
      <div class="split">
        <div class="sleft">
          <section class="panel">
            <div class="panel-h"><h3 data-i18n="panel.timeline"></h3></div>
            <div class="panel-b"><ul class="tl" id="timeline"></ul></div>
          </section>

          <details class="more">
            <summary><span data-i18n="more.title"></span></summary>
            <div class="morebody">
              <section class="sub hide" id="learnCard">
                <h4 data-i18n="learn.title"></h4>
                <p class="lnroute" id="learnRoute"></p>
                <p class="lnsay" id="learnSay"></p>
                <button class="ghost sm" id="learnApply" data-i18n="learn.apply"></button>
              </section>

              <section class="sub">
                <h4 data-i18n="panel.breakdown"></h4>
                <ul class="brk" id="breakdown"></ul>
              </section>

              <section class="sub">
                <h4 data-i18n="panel.fare"></h4>
                <ul class="brk" id="fareBrk"></ul>
                <p class="note" id="fareNote"></p>
              </section>

              <section class="sub">
                <h4 data-i18n="panel.tips"></h4>
                <ul class="tips" id="tips"></ul>
              </section>

              <section class="sub">
                <h4 data-i18n="panel.prep"></h4>
                <div id="prepList"></div>
                <div class="addrow">
                  <input type="text" id="prepName" data-i18n-ph="ph.prepName" autocomplete="off">
                  <input type="number" id="prepMin" value="10" min="0" max="240" data-i18n-al="unit.minShort">
                  <button id="prepAdd" data-i18n="btn.add"></button>
                </div>
                <div class="tot"><span data-i18n="prep.total"></span><b><span id="prepTotal">0</span> <span id="prepUnit"></span></b></div>
              </section>

            </div>
          </details>
        </div>

        <div class="sright">
          <section class="mapwrap">
            <div class="maphead">
              <div class="segs maptabs" role="group" data-i18n-al="panel.map">
                <button data-mapv="live" aria-pressed="true" data-i18n="map.live"></button>
                <button data-mapv="plan" aria-pressed="false" data-i18n="map.plan"></button>
              </div>
              <a class="gmlink" id="gmLink" target="_blank" rel="noopener" data-i18n="map.google"></a>
            </div>
            <div id="mapLive"></div>
            <div id="mapHost"></div>
            <p class="maphint" id="mapHint"></p>
            <div class="maplegend" id="mapLegend"></div>
          </section>

          <section class="panel faretab">
            <h4 data-i18n="fareTab.title"></h4>
            <table class="ftab">
              <thead><tr>
                <th data-i18n="fareTab.line"></th>
                <th data-i18n="fareTab.base"></th>
                <th data-i18n="fareTab.per"></th>
                <th data-i18n="fareTab.cap"></th>
              </tr></thead>
              <tbody id="fareTable"></tbody>
            </table>
            <p class="note" data-i18n="fareTab.note"></p>
          </section>
        </div>
      </div>

      <!-- ============ อากาศ + เดินทางล่าสุด ============ -->
      <div class="botrow">
        <section class="wxcard">
          <div class="wxtop">
            <div class="wxnow" id="wxNow"></div>
            <div class="wxside">
              <h3 data-i18n="wx.title"></h3>
              <div class="wxwhen" id="wxWhen"></div>
              <div class="wxcond" id="wxCond"></div>
              <div class="wxplace" id="wxPlace"></div>
              <button class="wxgeo" id="wxGeo">
                <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                  <circle cx="8" cy="8" r="3" fill="currentColor"/>
                  <circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
                  <path d="M8 .8v2.2M8 13v2.2M.8 8h2.2M13 8h2.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                </svg><span data-i18n="wx.useGps"></span>
              </button>
            </div>
          </div>

          <div class="wxtabs" role="group" data-i18n-al="wx.chart">
            <button data-wxm="temp" aria-pressed="true" data-i18n="wx.m.temp"></button>
            <button data-wxm="rain" aria-pressed="false" data-i18n="wx.m.rain"></button>
            <button data-wxm="wind" aria-pressed="false" data-i18n="wx.m.wind"></button>
          </div>

          <div class="wxchart" id="wxChart"></div>
          <div class="wxdays" id="wxDays"></div>
          <p class="note" id="wxNote"></p>

          <div class="wxfootrow">
            <div class="segs" role="group" data-i18n-al="wx.override">
              <button data-wx="auto" aria-pressed="true" data-i18n="wx.auto"></button>
              <button data-wx="dry" aria-pressed="false" data-i18n="wx.dry"></button>
              <button data-wx="rain" aria-pressed="false" data-i18n="wx.rain"></button>
            </div>
            <span class="wxfoot" data-i18n="wx.src"></span>
          </div>
        </section>

        <section class="panel hide" id="recentCard">
          <div class="panel-h">
            <h3 data-i18n="recent.title"></h3>
            <button class="ghost sm" id="recentAll" data-i18n="recent.all"></button>
          </div>
          <div class="panel-b"><div class="recent" id="histRecent"></div></div>
        </section>
      </div>
    </div>

      <div id="dayView" class="hide">
        <section class="panel">
          <div class="panel-h"><h3 data-i18n="day.appts"></h3></div>
          <div class="panel-b">
            <div class="dp" id="dpRows"></div>
            <div class="addrow"><button id="dpAdd" data-i18n="day.add"></button></div>
          </div>
        </section>
        <section class="panel">
          <div class="panel-h"><h3 data-i18n="day.plan"></h3></div>
          <div class="panel-b"><ul class="chain" id="chain"></ul></div>
        </section>
      </div>

      <!-- ============ ประวัติการเดินทาง ============
           บันทึกอัตโนมัติทุกครั้งที่คำนวณสำเร็จ ผู้ใช้ไม่ต้องกดบันทึกเอง (ดู histTouch ใน app.js) -->
      <div id="histView" class="hide">
        <div class="histwho" id="histWho"></div>

        <section class="hkpis" id="histKpis"></section>

        <section class="panel" id="histTopCard">
          <div class="panel-h"><h3 data-i18n="hist.top"></h3></div>
          <div class="panel-b"><div class="hchips" id="histTop"></div></div>
        </section>

        <section class="panel">
          <div class="panel-h">
            <h3 data-i18n="hist.list"></h3>
            <div class="histacts">
              <button class="ghost sm" id="histExportBtn" data-i18n="hist.export"></button>
              <button class="ghost sm" id="histImportBtn" data-i18n="hist.import"></button>
              <input type="file" id="histFile" accept="application/json,.json" hidden>
              <button class="ghost sm" id="histClearBtn" data-i18n="hist.clear"></button>
            </div>
          </div>
          <div class="panel-b"><div id="histList"></div></div>
        </section>

        <p class="histfoot" data-i18n="hist.local"></p>
      </div>

      <div class="foot">
        <span data-i18n="foot.1"></span>
        <span data-i18n="foot.2"></span>
      </div>
  </main>
</div>

<!-- ============ หน้าเข้าสู่ระบบ (โหมดสาธิต) ============
     เป็นหน้าเต็มจอ ไม่ใช่กล่องลอย เพราะเป็นด่านแรกที่เจอตอนเปิดเว็บครั้งแรก
     ถ้าเข้ามาจากปุ่มบนหัวจอทั้งที่ใช้งานอยู่แล้ว จะมีปุ่มกากบาทให้ถอยกลับ (ดู openAuth) -->
<div class="login hide" id="loginView">
  <div class="logincard" role="dialog" aria-modal="true" aria-labelledby="authTitle">

    <aside class="loginside">
      <div class="lgbrand">
        <svg viewBox="0 0 28 28" width="26" height="26" aria-hidden="true">
          <path d="M6 21c0-6 16-8 16-14" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-dasharray="1 4.6"/>
          <circle cx="6" cy="21" r="3.6" fill="currentColor"/>
          <path d="M22 2.5a3.9 3.9 0 0 0-3.9 3.9c0 2.9 3.9 6.6 3.9 6.6s3.9-3.7 3.9-6.6A3.9 3.9 0 0 0 22 2.5z"
                fill="currentColor"/>
        </svg>
        <b data-i18n="app.name"></b>
      </div>
      <p class="lgtag" data-i18n="app.tagline"></p>

      <h3 class="lgwhy" data-i18n="auth.why"></h3>
      <ul class="lgfeat">
        <li><span data-i18n="auth.f1"></span></li>
        <li><span data-i18n="auth.f2"></span></li>
        <li><span data-i18n="auth.f3"></span></li>
      </ul>
      <p class="lgnote" data-i18n="auth.storeNote"></p>
    </aside>

    <div class="loginmain">
      <button class="modalx" id="authClose" data-i18n-al="auth.back">×</button>
      <h2 id="authTitle" data-i18n="auth.title"></h2>
      <p class="modalsub" data-i18n="auth.sub"></p>

      <form class="mailform" id="mailForm">
        <label for="authMail" data-i18n="auth.mailLabel"></label>
        <input type="email" id="authMail" required autocomplete="email" data-i18n-ph="auth.mailPh">
        <button class="primary" type="submit" data-i18n="auth.mailGo"></button>
      </form>
      <p class="mailnote" data-i18n="auth.mailNote"></p>

      <div class="ordiv"><span data-i18n="auth.or"></span></div>

      <button class="oauth" data-provider="google">
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.17-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71a5.41 5.41 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        <span data-provider-label="Google"></span>
      </button>

      <button class="oauth" data-provider="apple">
        <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true" fill="currentColor">
          <path d="M12.42 9.53c-.02-1.9 1.55-2.81 1.62-2.86-.88-1.29-2.26-1.47-2.75-1.49-1.17-.12-2.28.69-2.87.69-.59 0-1.5-.67-2.47-.65-1.27.02-2.44.74-3.09 1.87-1.32 2.29-.34 5.68.95 7.54.63.91 1.38 1.93 2.36 1.89.95-.04 1.31-.61 2.46-.61s1.47.61 2.47.59c1.02-.02 1.67-.93 2.29-1.84.72-1.05 1.02-2.07 1.04-2.13-.02-.01-2-.77-2.01-3.05zM10.6 3.7c.52-.64.87-1.52.78-2.4-.75.03-1.66.5-2.2 1.13-.48.56-.9 1.46-.79 2.32.84.07 1.69-.42 2.21-1.05z"/>
        </svg>
        <span data-provider-label="Apple"></span>
      </button>

      <button class="oauth" data-provider="facebook">
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <circle cx="9" cy="9" r="9" fill="#1877F2"/>
